name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project
        run: unzip -q ShoppingListApp_v4.zip
      - name: Build debug APK
        working-directory: ShoppingListApp_v4
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ShoppingList-debug-apk
          path: ShoppingListApp_v4/app/build/outputs/apk/debug/*.apk
